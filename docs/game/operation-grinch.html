<script>'use strict';

const radarPlanes = [...document.querySelectorAll('.radar-plane')].map((element, index) => {

  return { element, type: element.dataset.aircraftType || ['civil', 'fighter', 'bomber'][index % 3], radius: index < 2 ? 27 : Math.hypot(x, y),
    phase: index < 2 ? (index ? 0.38 : -0.38) : Math.atan2(y, x),
    speed: index < 2 ? (index ? -0.035 : 0.035) : (index % 2 ? -1 : 1) * (index >= 10 ? 0.014 : 0.025 + index * 0.002),

const crashEffects = [];
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let radarFrame;

const radarEchoSeconds = 10;

  if (age < 0 || age >= radarEchoSeconds) return 0;

}
function beamCrossed(previous, current) {
  return Number.isFinite(previous) && previous * current <= 0 && Math.abs(current - previous) < Math.PI;
}
let radarPaused = false;
let fieldSize = planeField.getBoundingClientRect().width;
new ResizeObserver(entries => { fieldSize = entries[0].contentRect.width; }).observe(planeField);
const clamp = value => Math.max(0, Math.min(1, value));
const smoothstep = value => { const t = clamp(value); return t * t * (3 - 2 * t); };
let cinema = null;
function cinematicEnvelope(elapsed) {
  if (elapsed <= 0 || elapsed >= 2.4) return 0;
  if (elapsed < 0.32) return smoothstep(elapsed / 0.32);
  if (elapsed <= 1.05) return 1;
  return 1 - smoothstep((elapsed - 1.05) / 1.35);
}
function finishCinematic() {
  cinema?.wave.remove();

  cinemaCamera.style.transform = '';
  cinemaCamera.style.removeProperty('will-change');
  radar.classList.remove('cinematic-active');
  radar.style.setProperty('--cinema-envelope', '0');
  radar.dataset.cinemaState = 'idle';
  gridDisplacement.setAttribute('scale', '0');
  cinemaCamera.getAnimations({subtree:true}).forEach(animation => { animation.playbackRate = 1; });
}
function startCinematicImpact(x, y) {
  if (reducedMotion.matches || radarPaused || cinema) return;
  const field = planeField.getBoundingClientRect();
  const frame = radar.getBoundingClientRect();
  const focusX = field.left - frame.left + (50 + x) * fieldSize / 100;
  const focusY = field.top - frame.top + (50 + y) * fieldSize / 100;
  const limit = (value, maximum) => Math.max(-maximum, Math.min(maximum, value));
  const wave = document.createElement('div');
  wave.className = 'cinema-shockwave';
  wave.setAttribute('aria-hidden', 'true');
  wave.style.left = `${50 + x}%`;
  wave.style.top = `${50 + y}%`;
  wave.innerHTML = '<span class="shockwave-ring"></span><span class="shockwave-ring shockwave-echo"></span><span class="shockwave-halo"></span>';
  planeField.appendChild(wave);
  cinema = {elapsed:0,simulationStart:simulationTime,wave,rings:[...wave.children],panX:limit((frame.width/2-focusX)*0.7,frame.width*0.14),panY:limit((frame.height/2-focusY)*0.7,frame.height*0.14)};
  cinemaCamera.style.willChange = 'transform';
  radar.classList.add('cinematic-active');
  radar.dataset.cinemaState = 'slow-motion';
}
function updateCinematic(deltaTime) {
  if (!cinema) return 1;
  cinema.elapsed += deltaTime;
  if (cinema.elapsed >= 2.4) { finishCinematic(); return 1; }

  const age = simulationTime - cinema.simulationStart;
  const scale = 1 + envelope * 0.32;
  cinemaCamera.style.transform = `translate(${cinema.panX * envelope}px,${cinema.panY * envelope}px) scale(${scale})`;
  radar.style.setProperty('--cinema-envelope', String(envelope));
  radar.dataset.cinemaState = cinema.elapsed < 1.05 ? 'slow-motion' : 'recovering';
  cinema.rings.forEach((ring, index) => {
    const progress = clamp((age - index * 0.07) / (index === 2 ? 0.65 : 1.05));
    const spread = 1 - (1 - progress) ** 3;
    ring.style.transform = `translate(-50%,-50%) scale(${0.15 + spread * (index === 2 ? 5 : 12)})`;
    ring.style.opacity = String(Math.sin(Math.PI * progress) * (index === 0 ? 0.8 : 0.35));
  });
  gridDisplacement.setAttribute('scale', String(Math.sin(Math.PI * clamp(age / 1.05)) * 12));
  return 1 - envelope * 0.78;
}
function beginCrash(plane, time) {
    plane.evasion = null;
  plane.crashAt = time;
  plane.crashX = plane.x;
  plane.crashY = plane.y;
  plane.crashVX = plane.vx || 0;
  plane.crashVY = plane.vy || 0;
  plane.crashHeading = plane.heading || 0;
}

function spawnCrashEffect(x, y, time) {
  const effect = document.createElement('div');
  effect.className = 'crash-effect';
  effect.style.left = `${50 + x}%`;
  effect.style.top = `${50 + y}%`;
  const smoke = Array.from({ length: 5 }, (_, k) =>
    `<span class="crash-smoke" style="--smoke-x:${(k - 2) * 7}px;--smoke-size:${17 + (k % 3) * 5}px;animation-delay:${0.18 + k * 0.045}s"></span>`).join('');
  const flames = Array.from({ length: 3 }, (_, k) =>
    `<span class="crash-flame" style="--flame-x:${(k - 1) * 6}px;--flame-size:${k === 1 ? 27 : 20}px;animation-delay:${0.05 + k * 0.035}s"></span>`).join('');
  const particles = Array.from({ length: 12 }, (_, k) => {
    return `<span class="${k < 4 ? 'crash-debris' : 'crash-ember'}" data-particle="${k}"></span>`;
  }).join('');
  effect.innerHTML = smoke + '<span class="crash-ring"></span>' + flames + particles + '<span class="crash-flash"></span>';
  planeField.appendChild(effect);
  effect.querySelectorAll('[data-particle]').forEach((particle, k) => {
    const angle = k * 2.39996;
    const speed = 18 + (k % 4) * 9;
    const heavy = k < 4;
    const frames = Array.from({ length: 13 }, (_, frame) => {
      const progress = frame / 12;
      const elapsed = progress * (heavy ? 1.65 : 1.05);
      const travel = (1 - Math.exp(-elapsed * 1.5)) / 1.5;
      const px = Math.cos(angle) * speed * travel;
      const py = Math.sin(angle) * speed * travel + (heavy ? 17 : 8) * elapsed * elapsed;
      return { offset: progress, transform: `translate(${px}px,${py}px) rotate(${(heavy ? 240 : 80) * elapsed}deg) scale(${1 - progress * 0.6})`, opacity: 1 - smoothstep((progress - 0.35) / 0.65) };
    });
    particle.animate(frames, { duration: heavy ? 1650 : 1050, delay: 25 + k * 12, fill: 'both', easing: 'linear' });
  });
  crashEffects.push({ element: effect, createdAt: time });
}
document.querySelector('.radar').removeAttribute('aria-hidden');

// Zoom only the scene; captions, controls and the warning remain steady.

radarScale.innerHTML = '<defs><pattern id="radar-grid-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="0.65" fill="#70c991" opacity="0.2" stroke="none"/></pattern></defs><circle cx="200" cy="200" r="187" fill="url(#radar-grid-dots)" stroke="none"/>' + [47,94,141,188].map(radius => `<circle cx="200" cy="200" r="${radius}"/>`).join('') + Array.from({length:72},(_,index) => {
  const angle = (index*5-90)*Math.PI/180;
